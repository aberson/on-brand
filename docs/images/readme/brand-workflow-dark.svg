<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 286" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,'Roboto Mono',monospace" role="img" aria-labelledby="title desc">
  <title id="title">The on-brand workflow</title>
  <desc id="desc">Presets initialize brand sources directly. Website and image extraction create proposals for preview and operator review. Adopted sources are built and checked, then their generated files are committed and imported by consuming projects.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6E9BFF"/></marker>
    <marker id="step" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#384153"/></marker>
    <filter id="shadow" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.5)"/></filter>
  </defs>
  <style>
    .bg{fill:#161C26;stroke:#29313F;stroke-width:1.5}
    .spine{fill:none;stroke:#6E9BFF;stroke-width:2.4;marker-end:url(#arrow)}
    .link{fill:none;stroke:#384153;stroke-width:1.7;marker-end:url(#step)}
    .node rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#shadow)}
    .name{fill:#6E9BFF;font-size:13px;font-weight:600}
    .sub{fill:#7C8598;font-size:10.5px}
    .label{fill:#7C8598;font-size:11px;letter-spacing:.12em;font-weight:600}
    .caption{fill:#7C8598;font-size:10.5px}
  </style>
  <rect class="bg" x="6" y="6" width="988" height="274" rx="16"/>
  <text class="label" x="24" y="32">CHOOSE A SOURCE</text>
  <text class="label" x="280" y="32">REVIEW + ADOPT</text>
  <text class="label" x="536" y="32">BUILD + CHECK</text>
  <text class="label" x="792" y="32">USE IN YOUR PROJECT</text>
  <path class="spine" d="M224,77 H536"/>
  <text class="caption" x="280" y="66">preset → sources directly</text>
  <path class="spine" d="M224,137 H280"/>
  <path class="spine" d="M224,197 H252 V137 H280"/>
  <path class="link" d="M380,160 V176"/>
  <path class="spine" d="M480,199 H508 V77 H536"/>
  <path class="link" d="M636,100 V116"/>
  <path class="link" d="M636,162 V178"/>
  <path class="spine" d="M736,201 H764 V105 H792"/>
  <path class="link" d="M892,128 V152"/>
  <g class="node"><rect x="24" y="54" width="200" height="46" rx="10"/><text class="name" x="38" y="75">init</text><text class="sub" x="38" y="92">default · house-docs</text></g>
  <g class="node"><rect x="24" y="114" width="200" height="46" rx="10"/><text class="name" x="38" y="135">from-url</text><text class="sub" x="38" y="152">website → draft + evidence</text></g>
  <g class="node"><rect x="24" y="174" width="200" height="46" rx="10"/><text class="name" x="38" y="195">from-image</text><text class="sub" x="38" y="212">local raster → draft + trace</text></g>
  <g class="node"><rect x="280" y="114" width="200" height="46" rx="10"/><text class="name" x="294" y="135">preview</text><text class="sub" x="294" y="152">specimen · explanation</text></g>
  <g class="node"><rect x="280" y="176" width="200" height="46" rx="10"/><text class="name" x="294" y="197">review + adopt</text><text class="sub" x="294" y="214">copy the approved brand/</text></g>
  <g class="node"><rect x="536" y="54" width="200" height="46" rx="10"/><text class="name" x="550" y="75">brand/ sources</text><text class="sub" x="550" y="92">tokens + dark overlay</text></g>
  <g class="node"><rect x="536" y="116" width="200" height="46" rx="10"/><text class="name" x="550" y="137">build</text><text class="sub" x="550" y="154">generate each output</text></g>
  <g class="node"><rect x="536" y="178" width="200" height="46" rx="10"/><text class="name" x="550" y="199">check</text><text class="sub" x="550" y="216">contrast · schema · freshness</text></g>
  <g class="node"><rect x="792" y="82" width="200" height="46" rx="10"/><text class="name" x="806" y="103">generated files</text><text class="sub" x="806" y="120">CSS · TW · TS · PY · SVG</text></g>
  <g class="node"><rect x="792" y="152" width="200" height="46" rx="10"/><text class="name" x="806" y="173">commit + import</text><text class="sub" x="806" y="190">apps · charts · docs</text></g>
  <text class="caption" x="24" y="261">Proposals are built for review. Consuming projects read committed files; regeneration is explicit.</text>
</svg>
